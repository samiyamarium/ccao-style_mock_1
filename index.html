<script>
const Q=[
{d:"Output Evaluation",q:"A finance analyst asks Claude to summarize a 40-page annual report for the CFO. The summary states total operating expenses of $4.82M, but the line items Claude listed add up to $4.61M. The CFO will use the total in a board decision tomorrow. What is the best response?",o:[
"Accept the stated total as reliable, since each individual line item was drawn correctly from the source report and Claude's language generation is generally strong when a full document has been supplied for grounding, meaning small arithmetic mismatches of this kind are typically just rounding artifacts from formatting rather than real computational errors.",
"Have Claude rewrite the summary in a more assertive, confident tone and add a brief note explaining that the $4.82M figure reflects the most defensible reading of the report, since a confident and well-reasoned-sounding explanation is usually a reliable signal that the underlying number has been double-checked before being presented.",
"Treat any decision-critical number as something that must be computed rather than generated from language patterns: have Claude (or a spreadsheet) actually sum the listed rows using code or formulas, display the calculation so it can be inspected line by line, and then separately verify that the correct rows, categories, and time period were included before the total goes anywhere near the board.",
"Re-run the exact same summarization request on the largest available Claude model instead of the current one, on the reasoning that model scale is the primary driver of numerical accuracy and that a more capable model will simply not make the kind of addition error a smaller model might."
],a:2,e:"Language models predict plausible-sounding totals rather than mechanically adding columns, so a mismatch between line items and a stated total is a real red flag, not a rounding quirk. A confident tone and a plausible-sounding justification are not evidence of correctness — they are exactly the surface features that make a wrong number dangerous. Numbers that matter for a decision need a visible, checkable calculation (code or spreadsheet formulas) plus a check that the right inputs went into it. Swapping to a larger model does not turn pattern-completion into arithmetic; it may reduce the error rate somewhat but provides no guarantee and no auditable trail."},
{d:"Output Evaluation",q:"A procurement lead pastes three vendor proposals into Claude and asks which vendor allows early contract exit. Claude answers confidently that Vendor A offers a 30-day penalty-free exit and cites '99.97% on-time delivery'. Neither figure appears in any proposal. What prompt change best reduces this failure and makes checking faster?",o:[
"Instruct Claude to answer strictly from the attached proposals and nothing else, to explicitly say 'not stated in the provided documents' whenever a proposal is silent on a term rather than inferring an industry-typical figure, and to quote the specific section heading and sentence that supports every concrete term or number it reports, so a reviewer can jump straight to the source text.",
"Ask Claude to 'be more careful,' 'double-check the numbers,' and 'make sure everything is accurate' before it finalizes its answer, since explicitly instructing a careful, deliberate pass over the material is generally sufficient to catch fabricated details before they are surfaced to the user.",
"Add a persona instruction such as 'You are the world's most experienced enterprise procurement expert with 30 years of contract negotiation experience,' on the theory that assigning deep domain expertise causes the model to draw on more accurate, specific knowledge about standard industry contract terms and delivery benchmarks.",
"Ask Claude to attach a numeric confidence percentage to every claim it makes in the comparison, and treat any claim above roughly 90% confidence as verified enough to pass along to the vendor selection committee without further checking."
],a:0,e:"Grounding the model strictly to the supplied documents, giving it explicit permission (and instruction) to say a term is not stated, and requiring quotable evidence for every concrete claim together stop the model from filling gaps with plausible-sounding training-data patterns, and they give a human reviewer something concrete to check quickly. Telling a model to 'be careful' does not add a verification mechanism — it is just more instruction text, not a process. An expert persona changes the voice and framing of the response, not its access to accurate facts, and self-reported confidence scores are themselves generated text with no guarantee of correlating to actual accuracy."},
{d:"Output Evaluation",q:"An operations manager uses Claude in a chat window with no connectors enabled. Claude replies: 'I have emailed the updated schedule to all 12 team leads and confirmed delivery.' The manager plans to skip the follow-up. What is the correct interpretation?",o:[
"The claim can reasonably be trusted, because Claude phrased it in the past tense, gave a specific and plausible number of recipients (12), and described a confirmation step, all of which are the kind of concrete, verifiable-sounding details that typically indicate a real action actually took place rather than a generic assumption.",
"A claimed action is only a sentence of generated text until an actual tool result — a sent-message confirmation, an opened inbox, or a system log — demonstrates it happened; since no email connector was enabled in this chat, the email cannot actually have been sent regardless of how the sentence is phrased, so the manager needs to either send it manually or enable and verify a genuine email-sending connector before treating the schedule as distributed.",
"The email was most likely sent through some background integration the manager may not be fully aware of, so the safest and most efficient step is simply to ask Claude to resend it once more just to be extra certain, rather than digging into what tools were actually available in the session.",
"Delivery-confirmation claims like this one can generally be trusted when they appear inside a Projects workspace with saved context, even though the same claim would be considered unreliable in an ordinary chat session with no memory or project files attached."
],a:1,e:"A hallmark of fabricated model output is describing a real-world action — sending an email, updating a system, confirming delivery — that never actually occurred, and specificity (a plausible number, past tense, a confirmation phrase) makes such claims sound convincing without making them true. Without an actual tool capable of performing and logging that action, there is no mechanism by which the email could have been sent, no matter how the chat interface is framed (Projects vs. ordinary chat) or how many times the request is repeated."},
{d:"Prompting & Task Execution",q:"A consultant pastes three proposals and criteria into one prompt: 'Extract, compare, score and recommend.' The recommendation names a vendor for a feature its proposal never mentions, and the consultant can only judge the ending. What restructuring is most reliable?",o:[
"Keep the single combined prompt exactly as written, but append the instruction 'think step by step and check your work carefully before giving the final recommendation,' since asking a model to reason internally through a complex multi-stage task is generally sufficient to catch and self-correct any errors introduced during an earlier stage of that same reasoning pass.",
"Break the work into one request per stage — first extraction into a structured table, then comparison, then scoring, then recommendation — verifying a sample of the extracted cells directly against the original proposal text before moving on to the next stage, on the reasoning that an error introduced early (like a misattributed feature) will otherwise silently propagate into every downstream stage and become far harder to catch once buried inside a polished final recommendation.",
"Ask Claude to produce the final recommendation first, and only afterward request the supporting comparison table and score breakdown that justifies it, so that the consultant can read a short, decisive answer immediately and use the later supporting detail purely as optional backup material if a client happens to ask for it.",
"Keep the four-part combined request intact, but instead of processing all three vendors together, split the work into three separate prompts — one per vendor — under the assumption that shorter per-vendor prompts are less error-prone than a single longer prompt covering multiple vendors, regardless of whether the four-stage extract/compare/score/recommend chain within each prompt is broken apart."
],a:1,e:"A single pass through extraction, comparison, scoring, and recommendation hides exactly where a mistake was introduced, and internal 'think step by step' reasoning inside one continuous generation is not the same as an external checkpoint a human can inspect. Splitting by stage — with a sampled check against the source right after the highest-leverage step (extraction) — catches an error before it compounds. Reordering to put the conclusion first does not address the underlying chaining problem, and splitting by vendor while keeping the four internal stages fused together leaves the actual failure mode (unchecked chained reasoning) untouched."},
{d:"Prompting & Task Execution",q:"Claude's first draft of a product-onboarding guide is written for enterprise IT admins, but your audience is solo founders with tiny budgets. Your reply so far was 'Wrong, try again.' Which follow-up follows best practice for the description-discernment loop?",o:[
"Start an entirely new chat with the identical original prompt, on the assumption that the model's output is probabilistic enough that a fresh attempt with no added context or feedback has a reasonable chance of independently landing on the correct audience framing this time around.",
"Tell Claude that the entire draft is unusable and instruct it to start over completely from scratch with absolutely no hints about what went wrong, reasoning that withholding specific feedback prevents the model from anchoring on the previous mistake and instead forces it to generate a genuinely fresh, unbiased approach to the material.",
"Give specific, structured feedback that names the problem, explains why it matters, and points toward a direction: for example, 'Section 2 assumes enterprise IT teams with dedicated budgets and technical staff, but our actual readers are solo founders running lean with essentially no budget for tooling or support staff, so rewrite that section (and any similar assumptions elsewhere) with that audience specifically in mind.'",
"Accept the enterprise-focused draft as-is and simply edit it yourself line by line to fix the audience mismatch, on the reasoning that a first response missing something as fundamental as the target audience is a reliable signal that the model is not actually capable of producing usable onboarding content for this particular audience, however it is prompted."
],a:2,e:"A first draft is exactly that — a draft, not evidence of incapability. Specific feedback that identifies the problem, explains its consequence, and gives a concrete direction converges much faster than a bare 'wrong, try again,' a context-free do-over, or a brand-new chat with no memory of what went wrong. Rewriting it entirely yourself abandons the loop before giving the model a real chance to correct a fixable gap in the description you provided."},
{d:"Model & Feature Selection",q:"A retailer must classify 50,000 support tickets nightly by topic and urgency at low cost and latency, and about 20 complex escalations a day need nuanced multi-document analysis. Which design is best?",o:[
"Route every one of the 50,000 nightly tickets, including the routine ones, through the most capable and expensive model tier available, on the reasoning that consistency of output quality across the entire ticket volume matters more than the substantial added cost and latency, and that a uniformly high-capability approach avoids the risk of any ticket being mishandled by a lower-tier model.",
"Route everything, including the roughly 20 complex daily escalations, through the fastest and cheapest available model tier, since escalations represent a very small fraction of total volume (well under 1%) and any errors introduced at that tier are likely to be noticed and corrected downstream by customers or agents before causing real harm.",
"Use the fastest, cheapest available tier for the high-volume routine triage work, route the flagged complex escalations to a more capable tier suited to nuanced multi-document reasoning, and periodically validate a random sample of the routine triage outputs against a set of trusted, human-verified labels to confirm the cheaper tier's accuracy is holding up over time.",
"Select whichever model tier the team is already most familiar with or has used successfully on unrelated past projects, and only reconsider that choice later if the monthly API invoice comes in noticeably higher than expected, rather than basing the initial choice on the actual complexity or volume characteristics of this particular workload."
],a:2,e:"Matching model tier to the nature of the decision — cheap and fast for high-volume, low-complexity classification; more capable for genuinely hard multi-document reasoning — combined with ongoing sampled validation against trusted labels, is the design that controls both cost and quality. Using the top tier everywhere wastes money without a proportional accuracy gain on simple tickets; using the bottom tier everywhere risks real harm on the rare-but-important escalations; and choosing based on familiarity or reacting only after a large bill arrives ignores the actual workload characteristics that should drive the decision."},
{d:"Model & Feature Selection",q:"A compliance officer asks Claude what changed in a data-protection regulation amended last month. Claude's answer describes the older text and misses the amendment. The team proposes upgrading to a larger model. What is the best fix?",o:[
"Upgrade to the largest available model and re-ask the identical question unchanged, since larger models are generally trained on more comprehensive datasets and are therefore more likely to have absorbed very recent legal and regulatory amendments that smaller models may have missed during training.",
"Use a search-enabled or research capability so the answer is grounded in current published sources rather than the model's static training data, and then separately verify the resulting summary of the amendment against the official regulatory publication itself, since a model's training data has a fixed cutoff date and no amount of added parameters or scale changes that fundamental limitation.",
"Paste the prior year's full regulation text into a Project as reference material, on the reasoning that giving Claude the older regulation as a documented 'foundation' will help it reason its way to correctly inferring what the newer amendment likely changed, even without access to the amendment text itself.",
"Turn on a persistent memory feature and ask Claude to 'remember' this regulation going forward, under the assumption that enabling memory causes the model to begin automatically monitoring for and incorporating newly published legal or regulatory changes into its knowledge over time."
],a:1,e:"Every model has a training-data cutoff, and no amount of scale changes that; the fix for genuinely current information is a search or research capability grounded in live sources, followed by verification against the authoritative publication (essential for anything with legal weight). Uploading the older regulation gives the model something to reason from but not the actual amendment content, and memory features store notes from past conversations — they do not monitor the outside world or automatically ingest newly published legal text."},
{d:"Workflow & Solution Design",q:"A small business wants an agent to chase overdue invoices. The owner says only, 'Build me an invoice-chasing agent.' Which design step should come before any building?",o:[
"Grant the agent direct send access to both the accounting system and the company mailbox immediately, and plan to iteratively tune its behavior and tone based on how customers actually respond to its early messages once it is already live and operating in production.",
"Define the human/AI split first: which overdue invoices qualify for automated follow-up (age, amount, customer history), what tone and escalation sequence to use, the dollar amount above which a human must approve before anything is sent, whether the agent may send messages autonomously or only prepare drafts for review, and exactly how a customer dispute or unusual case gets escalated to a person.",
"Ask Claude itself to decide the underlying collections policy — including thresholds, tone, and escalation rules — on the reasoning that it has likely been exposed to a very wide range of invoice-chasing and collections workflows during training and can therefore be trusted to design reasonable business policy on the company's behalf without further input.",
"Start by selecting the largest and most capable available model for the underlying agent, on the assumption that any genuine gaps in business policy that the owner has not yet specified will simply be filled in by good judgment proportional to the model's overall capability level."
],a:1,e:"These are business-policy decisions, not prompting decisions, and delegation means deliberately deciding scope, tone, approval thresholds, and escalation paths before any authority is handed to an automated system — not discovering the policy live in production by watching customer reactions. Neither asking the model to invent policy nor picking a bigger model substitutes for the owner actually making these calls."},
{d:"Workflow & Solution Design",q:"An agency uses AI to reconcile bank statements. The demo looks flawless. The partner asks how to know it is safe to run monthly. Which plan is strongest?",o:[
"Approve the workflow for full production use based on the demo alone, since a demonstration that runs cleanly through a representative-looking set of transactions with no visible errors is generally a reliable indicator that the underlying matching logic will continue to perform correctly once it is handling the firm's real, ongoing monthly transaction volume.",
"Test the workflow against a substantial set of past reconciliations the firm already trusts and has verified by hand, explicitly measure the rate of wrong matches and unnecessary over-escalations, have an accountant independently spot-check a sample of the matches the system reports as successful (not only the ones it flags as failures), and keep humans directly responsible for approving adjustments and write-offs rather than letting the system finalize those on its own.",
"Review only the specific cases the agent itself flags as failures or uncertain matches, on the reasoning that any transaction the system reports as a successful, confident match has by definition already been correctly reconciled and therefore does not need separate independent review.",
"Let the workflow run completely unsupervised for a full three-month trial period, and evaluate its overall safety and reliability at the end of that window purely by comparing the firm's year-end aggregate totals against expectations, rather than checking individual transaction-level matches along the way."
],a:1,e:"A system can look flawless in a demo while still failing silently on cases the demo happened not to include, so real evaluation requires testing against a trusted, already-verified dataset, explicitly measuring error and over-escalation rates, and — critically — sampling the 'successful' matches too, since a system's own confidence in a match is not proof it is correct. High-stakes actions like adjustments and write-offs should stay with a human regardless of how well the system performs elsewhere."},
{d:"Configuration & Knowledge",q:"A marketing team repeatedly pastes the same 12-step brand-voice review checklist into new chats, and colleagues run it differently. They also want Claude to read live campaign metrics from an analytics tool. Which configuration fits best?",o:[
"Rely entirely on Claude's memory feature to retain the 12-step checklist across sessions and to independently pull in live campaign metrics whenever a relevant question comes up, on the assumption that memory functions as a general-purpose store of both procedural knowledge and access to outside live systems.",
"Continue placing the full checklist text into every new chat as a pasted attachment, and additionally have someone manually export a monthly metrics snapshot and attach that file as well, so that all context for the review is explicitly present in each individual conversation rather than depending on any persistent configuration.",
"Package the repeatable 12-step review process as a reusable Skill so it loads the same way every time regardless of who runs it, and use a connector to give Claude live access to the actual analytics data in the tool where the metrics already live, rather than relying on manual exports or on colleagues remembering to paste the checklist correctly and completely each time.",
"Write one substantially longer prompt that embeds the entire 12-step checklist text directly inline, and ask each team member to manually type or paste the current campaign metrics numbers into their message by hand every time they want to run the review."
],a:2,e:"A Skill turns a process description into something that loads consistently regardless of who invokes it, directly solving the 'colleagues run it differently' problem, while a connector gives genuine access to live external data rather than a stale manual export. Memory stores notes from past conversations, not standing procedures or live data feeds, and repeatedly pasting checklists or manually typing metrics remains exactly the fragile, inconsistent pattern the team is trying to escape."},
{d:"Configuration & Knowledge",q:"A support Project holds both the 2023 and the 2026 refund policies. Claude sometimes quotes the 2023 rules to customers. Which remedy is best?",o:[
"Instruct every support agent to explicitly remind Claude that the 2026 policy is the current one at the start of every single conversation, treating this reminder as a standing per-message workaround rather than changing anything about the underlying project configuration or documents.",
"Add several additional documents and examples illustrating the 2026 refund rules to the project knowledge base without removing or relabeling the older 2023 document, on the reasoning that Claude will naturally learn to weight the newer, more numerous 2026 examples more heavily than the single older 2023 document over time.",
"Retire or clearly relabel the outdated 2023 policy document (or remove it from the project entirely), date-stamp and version the remaining knowledge so it is unambiguous which document applies, and add explicit project instructions directing Claude to always prefer the most recent policy and to cite which specific document a given answer is drawn from.",
"Switch the project to the largest available Claude model on the assumption that increased model capability alone will allow it to reliably infer which of two conflicting policy documents in its knowledge base is the currently applicable one, without any change to the documents or instructions themselves."
],a:2,e:"Stale or conflicting source documents sitting side-by-side in a knowledge base is fundamentally a curation problem: removing or clearly relabeling the outdated version, adding explicit dating, and instructing the model to prefer the latest and cite its source directly addresses the conflict. Per-message reminders from agents are fragile and easy to forget, adding more 2026 examples without removing the 2023 document still leaves a genuine conflict present in the knowledge base, and a larger model has no special ability to correctly resolve a documented conflict you have not actually resolved yourself."},
{d:"Governance & Responsible Use",q:"A lecturer pastes student names, grades and disciplinary notes into a consumer AI service the university has not approved to draft end-of-term feedback. The comments are excellent. What is the most appropriate assessment?",o:[
"This is an acceptable use of the tool, since the resulting quality of the generated feedback comments is genuinely high and the students themselves stand to directly benefit from receiving well-written, thoughtful, and personalized end-of-term comments regardless of which specific tool was used to help draft them.",
"This is acceptable provided the lecturer deletes the chat session immediately afterward, since deleting the conversation from his own account is generally understood to remove any data-retention or third-party-visibility concerns that would otherwise apply to a consumer AI tool the university has not formally reviewed or approved for handling student records.",
"This is not a responsible use of the tool as described: the lecturer should be using a tool the university has actually approved for handling student data; where an approved tool exists but is more cumbersome, he should still minimize and redact data down to only the pattern the task genuinely needs (such as a grade range or a single behavioral note) without combining enough specific details that a student becomes identifiable; he should consider whether disclosure is warranted given that this feedback may enter official student records; and if the approved route is genuinely too difficult to use in practice, he should raise that friction with the policy owner rather than quietly routing around it.",
"This is acceptable as long as the lecturer removes only the students' surnames from what he pastes into the tool, since first names alone, combined with grades and disciplinary notes, are not considered personally identifying information in most institutional privacy frameworks."
],a:2,e:"Good output quality does not make an unauthorized use of student data responsible. Genuine creation diligence covers using an actually approved tool, minimizing and redacting data down to only what the task requires, recognizing that combinations of seemingly minor details (grade range plus disciplinary note plus context) can still re-identify a specific student even without a full name, considering disclosure obligations, and reporting friction with the approved path back to the policy owner instead of bypassing it. Deleting the chat afterward does not undo whatever the third-party service may have already processed or retained, and removing only surnames leaves an easily re-identifiable combination of details intact."},
{d:"Governance & Responsible Use",q:"HR uses Claude to rank job applicants. The ranked shortlist looks reasonable, but the recruiter cannot tell whether graduates of two universities are being favored. Deadlines are near. What is the best course?",o:[
"Send the shortlist forward as-is under the deadline pressure, since the ranking appears reasonable on its face and the recruiter has no concrete, specific evidence proving that graduates from either university are actually being systematically favored over equally qualified candidates from elsewhere.",
"Directly ask Claude whether its own ranking process was biased toward graduates of either university, and treat a confident denial from the model as sufficient reassurance to proceed with sending the shortlist forward without further independent checking.",
"Work through who is actually affected by this ranking decision, what could realistically go wrong if a bias is present and uncorrected, what a genuinely fair outcome would look like for this role, and what should be disclosed about how the ranking was produced; if there is real uncertainty after that analysis and the deadline genuinely cannot accommodate a full investigation, escalate the decision to the actual hiring decision owner rather than quietly proceeding on a guess, since a human must remain accountable for the outcome.",
"Remove the university field from the underlying data entirely and re-run the ranking process once more, on the reasoning that eliminating that one specific data point guarantees the resulting ranking can no longer reflect any bias correlated with university attended, since the model no longer has direct access to that field."
],a:2,e:"Automating the ranking process does not automate away accountability for its outcome. When there is genuine, unresolved uncertainty about a high-impact decision like this, the right move is to work through who is affected, what could go wrong, what fairness would look like, and what should be disclosed — and to escalate to the actual decision owner under deadline pressure rather than guessing. A confident self-report from the model that it was not biased is not independent evidence, deadline pressure alone is not a justification for skipping the check, and removing one field does not guarantee bias correlated with it (for example, through geography or other correlated signals) has actually been eliminated."},
{d:"Troubleshooting & Optimization",q:"In a long working session Claude has twice repeated a formatting error you corrected, and has become agreeable to everything you say. You have spent 25 minutes re-correcting. What is the best next move?",o:[
"Keep making the same correction each time the error reappears, on the reasoning that sufficient repetition and persistence within the same long conversation will eventually cause the correction to fully 'stick' for the remainder of the session, even though it has already failed to stick twice in a row.",
"Judge the underlying process rather than just the most recent answer: consider starting a genuinely fresh chat with a short, self-contained brief that restates the actual requirement rather than continuing to build on an increasingly long and possibly cluttered thread, add a performance description asking the model to actively challenge weak assumptions and flag its own uncertainty rather than simply agreeing, and be willing to take the specific task back yourself if the necessary fix genuinely depends on knowledge or judgment only you have.",
"Conclude from these two repeated errors within this one session that the model is fundamentally defective for this entire category of task, and decide to stop using AI assistance for any similar formatting-related work going forward, regardless of context length or how the request was framed.",
"Ask Claude directly to explicitly promise or commit that it will not repeat this particular formatting error again for the remainder of the session, on the reasoning that an explicit verbal commitment from the model functions as a reliable behavioral constraint on its subsequent outputs."
],a:1,e:"Process discernment means recognizing when continued steering within the same context is costing more than it is worth, and switching to a fresh, tightly-scoped chat (since a new session carries none of the accumulated clutter of the old one) or explicitly asking the model to push back on weak assumptions rather than agree with everything. Sheer persistence and asking for a promise are not actual mechanisms for changing model behavior, and two repeated errors in one long, possibly cluttered session is not strong evidence that the entire task category is beyond the model's capability."},
{d:"Troubleshooting & Optimization",q:"A team's AI drafting agent works well in each test conversation, yet stakeholders complain after launch that outcomes are inconsistent and people give up. The team can only inspect chats one by one. What should they build?",o:[
"Hire additional staff whose job is to manually read through every individual production conversation one at a time, on the reasoning that sufficiently thorough manual review of each chat is the most direct and reliable way to detect the inconsistency stakeholders are describing after launch.",
"Build repeatable evaluation suites run against a set of trusted, representative test cases, combined with ongoing monitoring and sampling that can observe behavior in aggregate across many real conversations rather than one at a time, and put release gates in place so that changes to the prompt, model, or configuration are checked against these evals before they ship to production.",
"Increase the model's temperature setting under the theory that reducing randomness in word choice will, as a side effect, also reduce the kind of behavioral inconsistency across conversations that stakeholders are complaining about.",
"Remove the system prompt entirely so that the agent has maximum freedom to adapt its behavior naturally to each individual conversation, on the assumption that removing fixed instructions will reduce rather than increase variability in outcomes across users."
],a:1,e:"Manually reading conversations one at a time does not scale to catching aggregate, cross-conversation inconsistency, which is exactly what eval suites, monitoring, sampling, and release gates are built to surface — by testing systematically against trusted cases and watching behavior in aggregate rather than reading transcripts individually. Adjusting temperature does not address inconsistency stemming from prompt or workflow design, and removing the system prompt removes a source of consistency rather than adding one, making variable outcomes more likely, not less."}
];

const PASS=72,SEC=900,app=document.getElementById('app');
let ans=Array(Q.length).fill(-1),cur=0,left=SEC,tm=null,done=false,rev=false;
const L="ABCD";
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function start(){app.innerHTML=`<div class="card"><div class="dm">Practice Exam · Block 1 of 5</div><h1 style="margin:.2em 0">CCAO-F Practice Exam</h1><p>15 scenario-based questions covering all seven blueprint domains, built from the Agent Factory study guide (4Ds, output evaluation, workflow design, skills &amp; connectors, governance).</p><p><b>Time:</b> 15 minutes · <b>Pass:</b> ${PASS}% (${Math.ceil(Q.length*PASS/100)} of ${Q.length}) · Feedback is shown only after you submit.</p><button class="b" onclick="go()">Start exam</button></div>`}
function go(){tm=setInterval(()=>{left--;const e=document.getElementById('tm');if(e){e.textContent=fmt(left);e.classList.toggle('lo',left<300)}if(left<=0)finish()},1000);draw()}
function draw(){const q=Q[cur];app.innerHTML=`<div class="bar"><span>Question ${cur+1}/${Q.length}</span><span class="t" id="tm">${fmt(left)}</span><button class="b" style="padding:7px 12px;font-size:14px" onclick="sub()">■ Stop &amp; get result</button></div><div class="pg"><i style="width:${(ans.filter(x=>x>=0).length/Q.length)*100}%"></i></div><div class="card"><div class="dm">${q.d}</div><p><b>Scenario:</b> ${q.q}</p>${q.o.map((t,i)=>`<button class="o ${ans[cur]===i?'s':''}" onclick="pick(${i})"><b>${L[i]})</b> ${t}</button>`).join('')}</div><div class="r"><button class="b g" onclick="mv(-1)" ${cur?'':'disabled'}>← Back</button>${cur<Q.length-1?`<button class="b" onclick="mv(1)">Next →</button>`:`<button class="b" onclick="sub()">Submit exam</button>`}</div><div class="nav">${Q.map((_,i)=>`<span class="${ans[i]>=0?'d':''} ${i===cur?'c2':''}" onclick="cur=${i};draw()">${i+1}</span>`).join('')}</div>`}
function pick(i){ans[cur]=i;draw()}function mv(n){cur+=n;draw()}
function sub(){const u=ans.filter(x=>x<0).length;if(!u||confirm(u+' question(s) unanswered. Submit anyway?'))finish()}
function finish(){if(done)return;done=true;clearInterval(tm);result()}
function result(){const ok=Q.map((q,i)=>ans[i]===q.a),n=ok.filter(Boolean).length,p=Math.round(n/Q.length*1000)/10,pass=p>=PASS;
const dom={};Q.forEach((q,i)=>{dom[q.d]=dom[q.d]||[0,0];dom[q.d][1]++;if(ok[i])dom[q.d][0]++});
app.innerHTML=`<div class="card">${pass?'<div class="star">⭐</div>':''}<h1 class="c" style="margin:.1em 0">${pass?'You passed! 🎉':'Not quite yet'}</h1><p class="big" style="color:${pass?'var(--ok)':'var(--no)'}">${p}%</p><p class="c">${n} of ${Q.length} correct · pass mark ${PASS}% · time used ${fmt(SEC-left)}</p><p class="c">${pass?'Outstanding work, shining star! Ready for Block 2.':'Review the explanations below, then retry. Weak domains are the likeliest to sink you on a different question draw.'}</p></div><div class="card"><b>Score by domain</b>${Object.entries(dom).map(([k,v])=>`<div class="dr"><span>${k}</span><span>${v[0]}/${v[1]}</span></div>`).join('')}</div><div class="r"><button class="b" onclick="rv()">Review answers</button><button class="b g" onclick="location.reload()">Retake</button></div>`;
if(pass)for(let i=0;i<28;i++)setTimeout(()=>{const s=document.createElement('div');s.className='sp';s.textContent=['⭐','✨','🌟'][i%3];s.style.left=Math.random()*95+'vw';s.style.top=(40+Math.random()*50)+'vh';document.body.appendChild(s);setTimeout(()=>s.remove(),2500)},i*90)}
function rv(){app.innerHTML=`<div class="r"><button class="b g" onclick="result()">← Results</button></div>`+Q.map((q,i)=>`<div class="card"><div class="dm">Q${i+1} · ${q.d}</div><p>${q.q}</p>${q.o.map((t,j)=>`<div class="o ${j===q.a?'ok':(j===ans[i]?'no':'')}"><b>${L[j]})</b> ${t}${j===ans[i]?' <i>(your answer)</i>':''}</div>`).join('')}<div class="ex"><b>Correct: ${L[q.a]}.</b> ${q.e}</div></div>`).join('')}
start();
</script></body></html>
