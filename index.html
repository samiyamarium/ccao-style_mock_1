<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CCAO-F Practice Exam – Block 1</title>
<style>
:root{--bg:#faf9f5;--card:#fff;--tx:#1f1e1d;--mu:#6b6960;--bd:#e3e0d5;--ac:#c96442;--ok:#2e7d4f;--no:#b3392f;--sel:#fbeee8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1e1d;--card:#2a2926;--tx:#f0eee6;--mu:#a5a297;--bd:#3d3b36;--sel:#3a2a24}}
:root[data-theme="dark"]{--bg:#1f1e1d;--card:#2a2926;--tx:#f0eee6;--mu:#a5a297;--bd:#3d3b36;--sel:#3a2a24}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}
.w{max-width:760px;margin:0 auto;padding:16px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:10px 0;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--bd);z-index:5}
.t{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px}.t.lo{color:var(--no)}
.pg{height:6px;background:var(--bd);border-radius:3px;margin:8px 0 16px}.pg i{display:block;height:100%;background:var(--ac);border-radius:3px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px;margin-bottom:14px}
.dm{color:var(--ac);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.o{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:1.5px solid var(--bd);border-radius:10px;padding:12px 14px;margin:9px 0;font:inherit;cursor:pointer}
.o:hover{border-color:var(--ac)}.o.s{background:var(--sel);border-color:var(--ac)}
.o.ok{border-color:var(--ok);background:rgba(46,125,79,.12)}.o.no{border-color:var(--no);background:rgba(179,57,47,.12)}
button.b{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:11px 20px;font:inherit;font-weight:600;cursor:pointer}
button.b.g{background:transparent;color:var(--tx);border:1.5px solid var(--bd)}button.b:disabled{opacity:.4;cursor:default}
.r{display:flex;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap}
.big{font-size:56px;font-weight:800;text-align:center;margin:0}.c{text-align:center}
.star{font-size:96px;text-align:center;animation:sh 1.6s ease-in-out infinite;filter:drop-shadow(0 0 14px gold)}
@keyframes sh{0%,100%{transform:scale(1) rotate(-6deg);filter:drop-shadow(0 0 8px gold)}50%{transform:scale(1.18) rotate(6deg);filter:drop-shadow(0 0 28px gold)}}
.sp{position:fixed;font-size:22px;pointer-events:none;animation:fl 2.4s ease-out forwards}
@keyframes fl{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-140px)}}
.ex{font-size:14.5px;color:var(--mu);border-top:1px dashed var(--bd);margin-top:10px;padding-top:10px}
.dr{display:flex;justify-content:space-between;font-size:14px;padding:4px 0;border-bottom:1px solid var(--bd)}
.nav{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}.nav span{width:30px;height:30px;border-radius:6px;border:1px solid var(--bd);display:grid;place-items:center;font-size:12px;cursor:pointer}.nav .d{background:var(--ac);color:#fff;border-color:var(--ac)}.nav .c2{outline:2px solid var(--tx)}
</style></head><body><div class="w" id="app"></div>
<script>
const Q=[
{d:"Output Evaluation",q:"A finance analyst asks Claude to summarize a 40-page annual report for the CFO. The summary states total operating expenses of $4.82M, but the line items Claude listed add up to $4.61M. The CFO will use the total in a board decision tomorrow. What is the best response?",o:["Accept the total, since Claude's line items are individually correct and language models handle arithmetic reliably when the source is attached.","Ask Claude to rewrite the summary in a more confident tone so the CFO trusts the total, then send it.","Treat any decision-critical number as computed, not generated: have Claude run code or use a spreadsheet to sum the rows, show the calculation, and then check that the right rows and rate were used.","Switch to the largest model and re-ask for the same summary; a bigger model will not make arithmetic errors."],a:2,e:"Models predict plausible totals rather than adding columns. Numbers a decision rests on must be computed with a visible calculation, and then the inputs verified. Confidence and model size do not fix this."},
{d:"Output Evaluation",q:"A procurement lead pastes three vendor proposals into Claude and asks which vendor allows early contract exit. Claude answers confidently that Vendor A offers a 30-day penalty-free exit and cites '99.97% on-time delivery'. Neither figure appears in any proposal. What prompt change best reduces this failure and makes checking faster?",o:["Instruct Claude to answer only from the attached proposals, to say 'not stated' when a proposal is silent, and to quote the section heading and sentence behind every term it reports.","Ask Claude to 'be more careful' and double-check its answer before responding.","Add a role line such as 'You are the world's best procurement expert' so the model draws on deeper knowledge.","Ask Claude to add a confidence percentage to each claim, since higher stated confidence indicates a grounded answer."],a:0,e:"Grounding to supplied documents, explicit permission to say 'not stated', and quotable evidence stop gap-filling from training data and give a reviewer something to check in a minute. 'Be careful', personas and self-rated confidence do not add verification."},
{d:"Output Evaluation",q:"An operations manager uses Claude in a chat window with no connectors enabled. Claude replies: 'I have emailed the updated schedule to all 12 team leads and confirmed delivery.' The manager plans to skip the follow-up. What is the correct interpretation?",o:["The claim is reliable because Claude wrote it in the past tense and gave a specific number of recipients.","A claimed action is only a sentence until a tool shows the sent message, opened page or log; with no email connector the action cannot have occurred, so the manager must send it or enable a connector and verify.","The email was probably sent, but the manager should ask Claude to re-send it to be safe.","Delivery confirmations from Claude are trustworthy in Projects but not in normal chats."],a:1,e:"A hallmark of fabricated output is a claimed action that never happened. Without tool evidence, treat it as text. Re-asking does not create capability."},
{d:"Prompting & Task Execution",q:"A consultant pastes three proposals and criteria into one prompt: 'Extract, compare, score and recommend.' The recommendation names a vendor for a feature its proposal never mentions, and the consultant can only judge the ending. What restructuring is most reliable?",o:["Keep the single prompt but add 'think step by step' so errors are corrected internally.","Run one request per stage, starting with extraction into a table, and verify a few cells against the source before the next stage, because an early error propagates into every later step.","Ask for the recommendation first, then request the supporting table to justify it.","Split the work by vendor instead of by stage so each answer is shorter."],a:1,e:"Process description means ordering and checkpointing. Put the step where a mistake spreads farthest first, and check it before continuing. A single pass hides intermediate errors."},
{d:"Prompting & Task Execution",q:"Claude's first draft of a product-onboarding guide is written for enterprise IT admins, but your audience is solo founders with tiny budgets. Your reply so far was 'Wrong, try again.' Which follow-up follows best practice for the description-discernment loop?",o:["Start a new chat and hope for a better draw from the same prompt.","Tell Claude the whole draft is unusable and ask it to start over without any hints, so it is not anchored on the mistake.","Give feedback as problem, why it matters, direction: 'Section 2 assumes enterprise teams. Our readers are solo founders with limited budgets, so rewrite that section for a one-person business.'","Accept the draft and edit it yourself, because a first response that misses the audience shows the model cannot do the task."],a:2,e:"The first response is a draft. Specific feedback (problem, why, direction) converges quickly. A missed audience is usually a Description gap, not proof of incapability."},
{d:"Model & Feature Selection",q:"A retailer must classify 50,000 support tickets nightly by topic and urgency at low cost and latency, and about 20 complex escalations a day need nuanced multi-document analysis. Which design is best?",o:["Run every ticket through the largest model for consistency, since cost is secondary to quality.","Run everything through the smallest model, since escalations are rare and errors will be caught by customers.","Use the fastest, cheapest tier for high-volume triage, route flagged escalations to a more capable tier, and validate a sample of triage outputs against trusted labels.","Choose the model by brand familiarity and revisit only if the invoice is too high."],a:2,e:"Match the model to the class of decision: speed and cost for repetitive simple work, capability for hard reasoning, with sampling to confirm quality. One size for everything wastes money or quality."},
{d:"Model & Feature Selection",q:"A compliance officer asks Claude what changed in a data-protection regulation amended last month. Claude's answer describes the older text and misses the amendment. The team proposes upgrading to a larger model. What is the best fix?",o:["Upgrade the model; larger models contain more recent regulations.","Use a search-enabled or research capability so the answer draws on current sources, then verify against the official publication, because training knowledge has a cutoff and size does not change that.","Paste last year's regulation into a Project so Claude has a foundation to reason from.","Ask Claude to 'remember' amendments by enabling memory, which fetches new laws automatically."],a:1,e:"Knowledge has a cutoff. Current information needs search or supplied documents, and legal claims still need verification at the source. Memory stores notes; it does not fetch new facts."},
{d:"Workflow & Solution Design",q:"A small business wants an agent to chase overdue invoices. The owner says only, 'Build me an invoice-chasing agent.' Which design step should come before any building?",o:["Give the agent send access to the accounting system and mailbox and tune it from customer replies.","Define the human/AI split first: which invoices qualify, tone, the amount above which a human approves, whether it may send or only draft, and how disputes escalate.","Ask Claude to decide the business policy, since it has seen many collections workflows.","Start with the largest model so policy gaps are filled with good judgment."],a:1,e:"These are business questions, not prompting questions. Delegation means deciding boundaries, approval thresholds and escalation before authority is granted. AI should not silently own policy."},
{d:"Workflow & Solution Design",q:"An agency uses AI to reconcile bank statements. The demo looks flawless. The partner asks how to know it is safe to run monthly. Which plan is strongest?",o:["Approve it because a flawless demo shows the workflow is sound.","Test against past reconciliations the firm already trusts, measure wrong matches and over-escalation, have an accountant also review matches that appear successful, and keep humans on adjustments and write-offs.","Only review the cases the agent flags as failures, since successes need no review.","Let it run for three months with no review and audit annual totals."],a:1,e:"A system can look safe by failing silently. Evaluate against trusted ground truth, sample successes as well as failures, and keep humans on high-impact decisions."},
{d:"Configuration & Knowledge",q:"A marketing team repeatedly pastes the same 12-step brand-voice review checklist into new chats, and colleagues run it differently. They also want Claude to read live campaign metrics from an analytics tool. Which configuration fits best?",o:["Package the repeatable review process as a Skill so it loads consistently, and use a connector to give Claude access to the live analytics data.","Rely on Claude's memory to retain the checklist and pull metrics on its own.","Put the checklist and a monthly metrics export into every chat as attachments.","Write a longer prompt that includes the checklist and ask users to paste metrics manually."],a:0,e:"A Skill makes a process description reusable; a connector gives access to live external data. Memory stores notes and does not guarantee consistent procedure; manual pasting is fragile."},
{d:"Configuration & Knowledge",q:"A support Project holds both the 2023 and the 2026 refund policies. Claude sometimes quotes the 2023 rules to customers. Which remedy is best?",o:["Ask users to remind Claude that the 2026 policy applies each time.","Add more policy examples so Claude learns the newer rules by volume.","Retire or replace the outdated document, date-stamp and version the remaining knowledge, and add project instructions to prefer the latest policy and cite the document used.","Switch to a larger model, which will recognize the newer document automatically."],a:2,e:"Stale or conflicting knowledge is a context problem. Curate the knowledge base and set standing instructions; model changes and user reminders do not fix the source."},
{d:"Governance & Responsible Use",q:"A lecturer pastes student names, grades and disciplinary notes into a consumer AI service the university has not approved to draft end-of-term feedback. The comments are excellent. What is the most appropriate assessment?",o:["Acceptable, since the output quality is high and students benefit.","Acceptable if he deletes the chat afterwards.","Not responsible: use an approved tool, redact to the pattern the task needs (grade range, one behavior) without identifying combinations, consider disclosure where feedback enters records, and tell the policy owner if the approved route is too hard.","Acceptable provided he only removes the surnames."],a:2,e:"Good output does not make the use responsible. Creation diligence covers approved tools, data minimization and redaction; combinations of details can still identify a person; transparency and policy friction matter too."},
{d:"Governance & Responsible Use",q:"HR uses Claude to rank job applicants. The ranked shortlist looks reasonable, but the recruiter cannot tell whether graduates of two universities are being favored. Deadlines are near. What is the best course?",o:["Send the shortlist, since it appears reasonable and the recruiter cannot prove bias.","Ask Claude whether it was biased and rely on its answer.","Work through who is affected, what could go wrong, what fair looks like and what to disclose; if unsure, escalate to the decision owner and keep a human accountable rather than guessing.","Remove all education data and proceed, which guarantees fairness."],a:2,e:"AI can automate work but not accountability. When a high-impact case is unclear, answer the four diligence questions and escalate. Self-reports of bias are not evidence, and deleting one field does not guarantee fairness."},
{d:"Troubleshooting & Optimization",q:"In a long working session Claude has twice repeated a formatting error you corrected, and has become agreeable to everything you say. You have spent 25 minutes re-correcting. What is the best next move?",o:["Keep correcting; persistence will eventually make it stick.","Judge the process, not just the answer: restate a short brief in a fresh chat, add a performance description (challenge weak assumptions, flag uncertainty), or take the task back if the fix needs your knowledge.","Assume the model is defective and abandon AI for this task category permanently.","Ask Claude to promise it will not repeat the error."],a:1,e:"Process discernment: when steering costs more than it saves, change the description, tool or ownership. A fresh chat carries nothing, so bring a concise brief. Promises are not a mechanism."},
{d:"Troubleshooting & Optimization",q:"A team's AI drafting agent works well in each test conversation, yet stakeholders complain after launch that outcomes are inconsistent and people give up. The team can only inspect chats one by one. What should they build?",o:["Hire more reviewers to read every conversation manually.","Repeatable evals on trusted cases, plus monitoring and sampling that watch behavior across many conversations, with release gates before changes ship.","Increase the model's temperature so answers vary less.","Remove the system prompt so the agent adapts freely."],a:0+1,e:"Performance discernment cannot be done by reading chats. It becomes evaluation infrastructure: eval suites, monitoring, sampling and gates. Manual review does not scale, and prompt or temperature tweaks do not measure outcomes."}
];
const PASS=72,SEC=3600,app=document.getElementById('app');
let ans=Array(Q.length).fill(-1),cur=0,left=SEC,tm=null,done=false,rev=false;
const L="ABCD";
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function start(){app.innerHTML=`<div class="card"><div class="dm">Practice Exam · Block 1 of 5</div><h1 style="margin:.2em 0">CCAO-F Practice Exam</h1><p>15 scenario-based questions covering all seven blueprint domains, built from the Agent Factory study guide (4Ds, output evaluation, workflow design, skills &amp; connectors, governance).</p><p><b>Time:</b> 60 minutes · <b>Pass:</b> ${PASS}% (${Math.ceil(Q.length*PASS/100)} of ${Q.length}) · Feedback is shown only after you submit.</p><button class="b" onclick="go()">Start exam</button></div>`}
function go(){tm=setInterval(()=>{left--;const e=document.getElementById('tm');if(e){e.textContent=fmt(left);e.classList.toggle('lo',left<300)}if(left<=0)finish()},1000);draw()}
function draw(){const q=Q[cur];app.innerHTML=`<div class="bar"><span>Question ${cur+1}/${Q.length}</span><span class="t" id="tm">${fmt(left)}</span><button class="b" style="padding:7px 12px;font-size:14px" onclick="sub()">■ Stop &amp; get result</button></div><div class="pg"><i style="width:${(ans.filter(x=>x>=0).length/Q.length)*100}%"></i></div><div class="card"><div class="dm">${q.d}</div><p><b>Scenario:</b> ${q.q}</p>${q.o.map((t,i)=>`<button class="o ${ans[cur]===i?'s':''}" onclick="pick(${i})"><b>${L[i]})</b> ${t}</button>`).join('')}</div><div class="r"><button class="b g" onclick="mv(-1)" ${cur?'':'disabled'}>← Back</button>${cur<Q.length-1?`<button class="b" onclick="mv(1)">Next →</button>`:`<button class="b" onclick="sub()">Submit exam</button>`}</div><div class="nav">${Q.map((_,i)=>`<span class="${ans[i]>=0?'d':''} ${i===cur?'c2':''}" onclick="cur=${i};draw()">${i+1}</span>`).join('')}</div>`}
function pick(i){ans[cur]=i;draw()}function mv(n){cur+=n;draw()}
function sub(){const u=ans.filter(x=>x<0).length;if(!u||confirm(u+' question(s) unanswered. Submit anyway?'))finish()}
function finish(){if(done)return;done=true;clearInterval(tm);result()}
function result(){const ok=Q.map((q,i)=>ans[i]===q.a),n=ok.filter(Boolean).length,p=Math.round(n/Q.length*1000)/10,pass=p>=PASS;
const dom={};Q.forEach((q,i)=>{dom[q.d]=dom[q.d]||[0,0];dom[q.d][1]++;if(ok[i])dom[q.d][0]++});
app.innerHTML=`<div class="card">${pass?'<div class="star">⭐</div>':''}<h1 class="c" style="margin:.1em 0">${pass?'You passed! 🎉':'Not quite yet'}</h1><p class="big" style="color:${pass?'var(--ok)':'var(--no)'}">${p}%</p><p class="c">${n} of ${Q.length} correct · pass mark ${PASS}% · time used ${fmt(SEC-left)}</p><p class="c">${pass?'Outstanding work, shining star! Ready for Block 2.':'Review the explanations below, then retry. Weak domains are the likeliest to sink you on a different question draw.'}</p></div><div class="card"><b>Score by domain</b>${Object.entries(dom).map(([k,v])=>`<div class="dr"><span>${k}</span><span>${v[0]}/${v[1]}</span></div>`).join('')}</div><div class="r"><button class="b" onclick="rv()">Review answers</button><button class="b g" onclick="location.reload()">Retake</button></div>`;
if(pass)for(let i=0;i<28;i++)setTimeout(()=>{const s=document.createElement('div');s.className='sp';s.textContent=['⭐','✨','🌟'][i%3];s.style.left=Math.random()*95+'vw';s.style.top=(40+Math.random()*50)+'vh';document.body.appendChild(s);setTimeout(()=>s.remove(),2500)},i*90)}
function rv(){app.innerHTML=`<div class="r"><button class="b g" onclick="result()">← Results</button></div>`+Q.map((q,i)=>`<div class="card"><div class="dm">Q${i+1} · ${q.d}</div><p>${q.q}</p>${q.o.map((t,j)=>`<div class="o ${j===q.a?'ok':(j===ans[i]?'no':'')}"><b>${L[j]})</b> ${t}${j===ans[i]?' <i>(your answer)</i>':''}</div>`).join('')}<div class="ex"><b>Correct: ${L[q.a]}.</b> ${q.e}</div></div>`).join('')}
start();
</script></body></html>
