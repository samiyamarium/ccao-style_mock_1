<script>
const Q=[
{d:"Prompting & Task Execution",q:"A customer success lead asks Claude to draft a renewal-risk email for an account, giving only the company name and 'they seem unhappy.' The resulting email is generic and could apply to any account, missing specifics that would make it persuasive. What is the root cause and best fix?",o:[
"Claude is fundamentally incapable of writing genuinely persuasive customer-facing emails of this kind, and a fixed, pre-written generic template should be used instead for all future renewal-risk communications rather than continuing to attempt AI-drafted versions.",
"The original input simply lacked the actual specifics a genuinely good output requires — recent support issues, usage trend data, prior commitments made to the customer — so the fix is to either supply those specific details directly, or to ask Claude to first explicitly list out what specific information it would need before attempting to draft the actual email.",
"Request three separate draft versions of the same generic email and then manually select whichever one of the three happens to read as somewhat less generic than the other two, without changing what underlying information was actually supplied.",
"Simply add the instruction 'make it more personal' to the existing prompt, without providing any of the actual account-specific information (recent issues, usage trends, prior commitments) that would be needed to genuinely personalize the resulting email."
],a:1,e:"Output quality is fundamentally bounded by the specificity of the input supplied; when key account-specific facts are genuinely missing, the fix is either supplying them directly or having the model explicitly surface what it actually needs, rather than requesting vague stylistic improvement ('more personal') or simply generating extra volume without adding any new substantive information."},
{d:"Prompting & Task Execution",q:"An engineer wants Claude to refactor a legacy module and also write new unit tests in the same response. The result mixes refactored code and test code together in one long block, making it hard to review or apply either part independently. What is the best correction?",o:[
"Ask Claude to simply add more inline comments throughout the single combined code block, on the reasoning that additional commenting alone will make it sufficiently easy to distinguish and independently apply the refactored module code versus the new unit test code without actually separating them into distinct outputs.",
"Explicitly request two separate, clearly labeled outputs in the original request itself — the refactored module as one output, and a separate test file as a second, distinct output — and specify the intended file or artifact structure expected for each of the two deliverables up front.",
"Ask Claude only for the code refactor itself in this and all future similar requests, and commit to writing all corresponding unit tests entirely manually from that point forward, rather than continuing to request both deliverables together in a single combined response.",
"Deliberately reduce the overall size and scope of the legacy module being refactored specifically so that the combined single-block output covering both the refactor and the tests together ends up shorter overall and therefore easier to read through as one undivided piece."
],a:1,e:"When a single request genuinely has two distinct deliverables, explicitly specifying separate, clearly labeled outputs (and the intended structure for each) up front produces reviewable, independently usable results directly, rather than requiring the engineer to manually untangle a combined block after the fact, give up on requesting one of the two deliverables entirely, or simply shrink the scope to make an inherently mixed single block marginally shorter."},
{d:"Output Evaluation",q:"A due-diligence analyst uses Claude to summarize a target company's litigation history from public filings. The summary lists four lawsuits, but one lawsuit described in detail was actually settled two years ago according to a later filing Claude also had access to. What does this scenario best illustrate?",o:[
"Claude fully fabricated the existence of this particular lawsuit out of nothing, which represents essentially the identical underlying failure mode as inventing an entirely fictional fact with no basis whatsoever in any of the actual source material provided.",
"Providing the correct underlying source documents does not by itself guarantee that correct synthesis across all of those documents will actually occur; even when the right information is genuinely available somewhere in the provided materials, cross-document consistency — such as recognizing that a later filing's settlement supersedes an earlier filing's description of ongoing litigation — still needs to be actively checked rather than simply assumed to have been correctly handled.",
"This particular scenario actually demonstrates that document-based summarization tasks of this kind are inherently safe from hallucination-type failures specifically because the relevant correct source material was genuinely provided to the model in this case.",
"The due-diligence analyst should have supplied only the single most recent filing to Claude in the first place, rather than including the earlier filing at all, in order to avoid this specific kind of confusion between an outdated status and a more current one."
],a:1,e:"Access to correct source material across multiple documents does not by itself guarantee correct synthesis of that material — conflicting or updating information across sources (an earlier filing superseded by a later settlement) still needs an explicit verification step, and this failure is distinct from fabricating a fact with no source basis at all. Removing the earlier filing could actually remove context genuinely needed to understand the litigation's full history, rather than fixing the underlying synthesis problem."},
{d:"Output Evaluation",q:"A teacher uses Claude to grade short-answer quizzes against an answer key and is pleased that it flags a student response as 'incorrect' for missing the phrase 'cellular respiration,' even though the answer describes the correct process in different words. What should the teacher do?",o:[
"Trust the current grading output exactly as it stands without further review, on the reasoning that the specific key phrase genuinely was missing from the student's response, which is sufficient justification for marking that response as incorrect regardless of whether the underlying concept was actually correctly described in different words.",
"Review any answers flagged as 'incorrect' specifically for cases where the underlying scientific concept was actually described correctly but simply phrased differently than the answer key, and adjust the grading instructions so the model evaluates conceptual correctness rather than requiring an exact phrase match against the key.",
"Discontinue AI-assisted grading of these quizzes entirely and revert to manually grading every single short-answer response by hand going forward, rather than adjusting the existing grading instructions to better handle conceptually correct but differently phrased answers.",
"Instruct students going forward to only ever use the exact wording found in the textbook when writing their short-answer responses, so that future responses will more reliably match the specific phrasing the automated grading process is currently looking for."
],a:1,e:"Rigid phrase-matching against a fixed key phrase produces false negatives whenever a concept is correctly expressed in different words, which is exactly what happened here; the fix is refining the grading instructions toward evaluating conceptual correctness and reviewing flagged edge cases, rather than discarding the automated grading tool entirely or shifting the burden onto students to memorize and reproduce exact textbook wording."},
{d:"Model & Feature Selection",q:"A finance team wants to build a lightweight internal tool where employees paste a vendor invoice and instantly see extracted totals, due dates and a compliance flag, embedded in their existing intranet page. Which approach best fits the need for something to embed and reuse repeatedly?",o:[
"Have each employee individually open a one-off chat conversation with Claude every single time they need to process a new invoice, repeating this same manual chat-based process independently across the entire finance team indefinitely.",
"Build a small, purpose-built interactive tool (such as an Artifact or a similar embeddable output) that takes pasted invoice text as its input and consistently returns the same structured set of extracted fields — totals, due dates, and a compliance flag — every time it is used, and that can be embedded directly into the existing intranet page for repeated reuse.",
"Set up a connector specifically to the company's email system, on the reasoning that because vendor invoices frequently arrive by email, an email connector alone is generally the most directly relevant capability for the actual described need of extracting structured fields from pasted invoice text on an intranet page.",
"Simply switch to using a larger, more expensive Claude model tier while continuing to rely on the same repeated one-off single-turn chat conversation approach described in the first option, rather than building any kind of dedicated, embeddable, reusable tool."
],a:1,e:"A repeatable, structured, embeddable tool that consistently returns the same set of extracted fields is exactly the right fit for a task employees will do the same way many times over on an intranet page; repeating individual one-off manual chats does not scale to this need, an email connector does not address the actual described input method (pasted invoice text on an intranet page), and a larger model applied to the same repeated single-turn chat pattern does not solve the underlying need for a reusable, embeddable tool."},
{d:"Model & Feature Selection",q:"A journalist needs an in-depth, well-sourced explainer on a fast-moving regulatory story from the last 48 hours, including quotes attributed to specific named officials. Which combination is most appropriate?",o:[
"Rely on a single-turn answer generated entirely from the base model's existing training knowledge with no additional tools enabled, on the reasoning that a regulatory story significant enough to be newsworthy is likely already well-represented in the model's training data regardless of how recently it actually occurred.",
"Use a search- or research-enabled capability specifically to gather genuinely current sources on this fast-moving 48-hour-old story, and then have the journalist independently verify every single quote attributed to a named official against the actual original source before any part of the explainer is published.",
"Use a larger, more capable model with no search or research capability enabled at all, trusting the model's own internal reasoning ability alone to correctly fill in whatever specific knowledge gaps exist regarding events from the last 48 hours.",
"Ask Claude to generate plausible-sounding quotes attributed to the named officials involved, written in a style consistent with how those particular officials are generally known to speak publicly, specifically in order to save the time that independently verifying each quote against an actual source would otherwise require."
],a:1,e:"A fast-moving, quote-specific regulatory story from the last 48 hours requires genuinely current sources (a search or research capability) plus independent verification of every specific attributed quote against its actual original source — training knowledge alone is necessarily stale for events this recent regardless of model size, and generating plausible-sounding quotes in an official's presumed style is outright fabrication, not legitimate journalism, however much time it might save."},
{d:"Workflow Integration",q:"A retailer's return-approval workflow uses Claude to evaluate return requests against policy and auto-approve straightforward cases under $50 with no prior return history flags, while routing all others to a human. After a month, a spike in fraudulent small-dollar returns is discovered, all under the auto-approval threshold. What is the best workflow adjustment?",o:[
"Lower the existing auto-approval dollar threshold all the way down to $0, effectively removing automated approval from the workflow entirely and routing every single return request to a human reviewer going forward regardless of how straightforward or low-risk it appears.",
"Analyze the specific pattern behind the discovered fraud, incorporate genuinely relevant additional risk signals into the auto-approval criteria (such as unusually high return frequency for a given account, or a mismatch between the shipping address and the account's usual address), and re-test the updated criteria against both known legitimate returns and the known fraudulent cases before redeploying the adjusted workflow.",
"Raise the existing auto-approval dollar threshold even higher than its current $50 level, on the general assumption that the underlying fraud pattern discovered here is unrelated to the specific dollar amount involved in a given return request.",
"Leave the existing auto-approval criteria completely unchanged despite the discovered fraud pattern, on the reasoning that some level of occasional fraud loss is generally an acceptable and expected cost of running any automated approval workflow of this kind."
],a:1,e:"An automation rule should evolve in response to an actually discovered failure pattern by incorporating the specific risk signals genuinely involved (return frequency, address mismatch) and being re-validated against both legitimate and known-fraud cases before redeployment — rather than removing automation entirely, raising the threshold without addressing the actual fraud pattern, or leaving the vulnerable criteria completely unchanged."},
{d:"Workflow Integration",q:"A hospital wants to use Claude to triage non-urgent patient portal messages by suggested urgency level, but a clinician warns that any misclassification of a truly urgent message as non-urgent could delay care. What is the safest workflow design?",o:[
"Fully automate the entire triage process with no clinical review of any kind at any stage, on the reasoning that Claude is generally capable of processing incoming patient messages considerably faster than human clinical staff could review them manually.",
"Design the triage system to deliberately bias toward escalation whenever a message is genuinely ambiguous (treating uncertain cases as more urgent rather than less), keep a qualified clinician actively reviewing all triage decisions — especially, and specifically, anything the system marks as non-urgent — and continuously monitor the system for any missed genuinely urgent cases over time.",
"Have a clinician review only the specific messages the triage system itself marks as urgent, while fully trusting every message the system classifies as non-urgent with no clinical review of that category at all.",
"Avoid using any AI assistance for any part of the patient portal messaging process whatsoever, on the reasoning that the clinician's stated concern about potential misclassification is sufficient reason to forgo the workflow's use of AI entirely rather than redesigning it to bias toward caution."
],a:1,e:"In a situation with genuinely asymmetric risk — where missing a truly urgent message is far more harmful than an unnecessary extra review — the safest design biases toward escalation on ambiguous cases and keeps clinical review specifically on the lower-flagged (non-urgent) category, rather than fully automating the process, trusting only one direction of the classification without review, or abandoning AI assistance entirely rather than redesigning the workflow to manage the actual risk asymmetry directly."},
{d:"Configuration & Knowledge",q:"A software company's Claude-based internal Q&A project answers questions about a product using a knowledge base that includes both public documentation and confidential unreleased roadmap notes. An external contractor was recently given access to the project. What is the primary risk and fix?",o:[
"There is no meaningful risk here at all, on the reasoning that external contractors of this kind typically sign general confidentiality agreements as a standard part of their engagement, which is generally understood to be sufficient protection regardless of what specific project content they are actually given direct system access to.",
"The underlying knowledge base was not properly segmented by intended audience in the first place: confidential unreleased roadmap content should be separated into a distinct project (or otherwise access-scoped) so it is genuinely not shared with external contractors at all, with the actual access grant itself reviewed carefully before being extended to any external party.",
"The correct fix is to remove every single document from the shared project entirely, including all of the public documentation, so that literally nothing is available to any user of the project regardless of whether they are an internal employee or an external contractor.",
"Simply ask Claude, as part of its standing instructions, to consciously avoid ever mentioning the confidential roadmap content specifically whenever an external contractor happens to be the one currently using the project, without making any actual change to what content the contractor's access grant technically includes."
],a:1,e:"Access should be genuinely scoped to what a specific audience is actually entitled to see; relying on the model itself to selectively withhold information it technically has full access to, or relying on a general confidentiality agreement alone, is not a substitute for actually segmenting the underlying knowledge base and carefully reviewing access grants before extending them to an external party. Removing all documentation, including the legitimately shareable public content, discards needed functionality without addressing the actual segmentation gap."},
{d:"Configuration & Knowledge",q:"A team notices Claude's answers about their internal tools have become inconsistent after several employees independently created similar-but-slightly-different Skills for the 'same' weekly reporting task. What governance step would best prevent this drift?",o:[
"Allow every individual employee to continue independently creating their own personal version of essentially the same reporting Skill, on the reasoning that a greater overall number of independently created but similar Skills increases organizational flexibility with no meaningful corresponding downside.",
"Establish a lightweight review or shared-ownership process specifically for commonly used Skills like this one, consolidate the several near-duplicate weekly-reporting Skills that already exist into a single version, and designate one specific, actively maintained canonical Skill as the standard for this shared task going forward.",
"Restrict Skill creation so that only the central IT department is permitted to create any Skills at all going forward, effectively halting all further team-level customization or Skill creation across the rest of the organization entirely.",
"Ask employees to simply email one another informally before creating any new reporting Skill in the future, with no other formal review, consolidation, or ownership process put in place beyond that informal email step."
],a:1,e:"Uncontrolled proliferation of near-duplicate Skills for the same underlying task is exactly what causes the observed drift and inconsistency; a lightweight review process, consolidation of the existing duplicates, and a single designated canonical version balances continued team flexibility with actual consistency far better than either unrestricted independent creation, a complete IT-only lockdown, or an informal email-based courtesy step with no real enforcement mechanism behind it."},
{d:"Configuration & Knowledge",q:"A company migrates its Claude project's knowledge base to a new document management system, but forgets to update the connector configuration pointing to the old system's now-archived location. Employees start getting 'document not found' style gaps in answers. What best describes the issue and fix?",o:[
"The underlying model itself has genuinely degraded in quality as a general matter, and the appropriate response is to request or wait for a full model replacement rather than examining the specific connector configuration involved in this particular migration.",
"The connector configuration is now pointing to a stale, archived, and effectively inaccessible source location that no longer reflects where the actual knowledge base content now lives; verifying and updating the connector's actual target location should be treated as a required part of any future document-system migration, with retrieval explicitly re-tested afterward before the connector is relied upon again.",
"Employees should be instructed to permanently work around the broken connector going forward by manually pasting relevant documents into each conversation by hand, rather than actually fixing the underlying connector configuration to point at the new document system's correct location.",
"This gap is an entirely expected, self-correcting side effect of any document-system migration, and no specific corrective action is genuinely required since the underlying issue will resolve itself automatically over time without any change to the connector's configuration."
],a:1,e:"Connectors point to a specific configured location or system, and infrastructure migrations of this kind must explicitly include updating (and then re-testing) that configuration, since the underlying model itself has not degraded or changed at all — the actual problem is a stale pointer left over from an incomplete migration step, not a model-quality issue, and it will not self-correct without someone actually updating the connector."},
{d:"Governance & Responsible Use",q:"A company's leadership wants to publicly announce that its customer service is '100% AI-powered and error-free' to differentiate from competitors, based on strong internal test results. What is the most responsible guidance to give before publishing this claim?",o:[
"Approve the proposed claim exactly as written, on the reasoning that the underlying internal test results were genuinely strong and therefore fully support making an absolute, unqualified public claim of complete error-freedom for the customer service system as a whole.",
"Advise against using 'error-free' framing specifically, since no deployed AI system of this kind can genuinely be guaranteed entirely free of errors regardless of how strong its internal test results were; instead recommend accurate, independently verifiable language describing the system's actual capabilities and known limitations, and ensure a real human escalation path genuinely exists and is clearly disclosed to customers.",
"Suggest removing any mention of AI from the public announcement entirely, on the reasoning that avoiding any reference to the underlying technology is generally a safer communications strategy than either making the strong 'error-free' claim or accurately describing the system's actual capabilities and limitations.",
"Approve the proposed '100% AI-powered and error-free' claim as originally written, but add a small disclaimer addressing the error-free framing somewhere in the footer of the announcement, in relatively inconspicuous placement, so that the disclaimer technically exists without meaningfully undermining the prominent headline claim."
],a:1,e:"An overstated, effectively unverifiable claim like 'error-free' creates genuine ethical, reputational, and potential regulatory risk regardless of how strong the internal test results genuinely were; the responsible guidance is accurate, verifiable framing of actual capabilities and limitations, plus a genuinely disclosed human escalation path — not simply approving the strong claim as written, not hiding AI's role from the public entirely, and not adding an inconspicuous disclaimer that does little to actually correct the substance of an overstated headline claim."},
{d:"Governance & Responsible Use",q:"An AI ethics review board is evaluating a proposed use of Claude to help decide which employees are selected for layoffs based on performance data summaries. Several board members note the stakes are extremely high and largely irreversible for affected individuals. What is the most appropriate recommendation?",o:[
"Approve full automation of the actual layoff-selection decision itself, on the reasoning that the underlying performance data being summarized is objective in nature and Claude can therefore process and apply it with full consistency across every affected employee without need for further human judgment in the actual selection step.",
"Recommend that AI may appropriately assist by organizing and summarizing the underlying performance data for human decision-makers to review, but that the actual employee-selection decision itself, and full accountability for that decision's consequences, must remain squarely with human decision-makers, with the underlying data and overall selection process kept genuinely auditable after the fact.",
"Recommend against using AI in any capacity whatsoever in connection with this process, including for the comparatively low-risk task of organizing and summarizing existing performance data for human reviewers to then use in making their own independent decisions.",
"Approve use of the tool for this layoff-selection purpose, but limit its use specifically to newer employees who have been with the company for a relatively short tenure, treating tenure length as the primary relevant safeguard for this kind of extremely high-stakes and largely irreversible decision."
],a:1,e:"For extremely high-stakes, largely irreversible decisions about specific individuals like layoff selection, the appropriate role for AI is assisting human judgment — organizing and summarizing relevant data — while the actual decision and full accountability for it remain with human decision-makers, with the process kept auditable. Full automation of the actual selection decision is inappropriate here, but a blanket ban that also excludes low-risk supporting uses like data summarization goes further than necessary, and limiting the tool's use by employee tenure does not actually address the core risk of the decision itself."},
{d:"Troubleshooting & Optimization",q:"A team's Claude-powered chatbot performs well in English but produces awkward, sometimes inaccurate responses in Spanish, the second most common language among its users, and this was never explicitly tested before launch. What is the most important corrective step?",o:[
"Simply assume that Spanish-speaking users will gradually adapt to somewhat lower-quality responses over time, on the reasoning that English is the chatbot's primary supported language and it is therefore reasonable to expect users of a secondary language to accommodate a meaningfully lower standard of quality without further corrective action.",
"Build a dedicated Spanish-language evaluation set using realistic Spanish-language queries actually representative of how Spanish-speaking users query the system, explicitly test and tune the chatbot's performance specifically for Spanish, and include Spanish alongside English going forward as part of any ongoing performance monitoring for the system.",
"Add a brief note to the chatbot interface specifically asking Spanish-speaking users to type their questions in English instead going forward, rather than making any underlying change to how the chatbot actually processes or handles Spanish-language input.",
"Switch the chatbot's primary supported language over entirely to Spanish going forward, effectively deprioritizing English support instead, on the reasoning that Spanish is the language where a genuine performance gap has actually been identified."
],a:1,e:"Performance across every meaningfully used language should be independently evaluated and monitored on its own terms using realistic queries in that language; simply assuming Spanish-speaking users will adapt, or asking them to switch to English instead, both shift the actual burden of the gap onto users rather than closing it, and switching primary language entirely over-corrects rather than addressing the actual multi-language coverage need directly."},
{d:"Troubleshooting & Optimization",q:"A team is proud that their Claude-based coding assistant has a 98% 'looks correct' approval rate from developers doing quick visual review of generated code, and uses this as their primary quality metric. Bugs from AI-generated code have nonetheless been increasing in production. What is the flaw in their measurement approach?",o:[
"There is no actual flaw in the team's current measurement approach: a 98% approval rate obtained from developers who have personally reviewed the generated code is generally strong, sufficient evidence on its own of the underlying code's genuine correctness and production-readiness.",
"A quick, purely visual 'looks correct' review by a developer is a comparatively weak proxy for actual functional correctness, since it can systematically miss subtly wrong but plausible-looking code; the metric should be supplemented with actual automated tests, genuine run-time verification, and explicit tracking of downstream production bugs specifically attributable to AI-generated code, rather than relying primarily on reviewer visual impressions alone.",
"The actual flaw here is that the developers doing this quick visual review are simply not qualified to review any code at all, and the appropriate fix is to replace them entirely with a different, more senior review team performing the same kind of quick visual approval process instead.",
"The most direct fix here is to lower the specific approval-rate threshold that the team currently treats as an acceptable quality bar, on the reasoning that a lower stated threshold will somehow more accurately reflect the code's actual underlying correctness even though the same superficial visual review method continues to be used to generate that percentage."
],a:1,e:"A quick, surface-level 'looks correct' visual judgment can systematically miss real defects — particularly subtly wrong but plausible-looking code, which is exactly the kind of bug pattern increasing in this team's production environment. A genuinely valid quality metric needs to connect to actual downstream outcomes (automated tests, run-time verification, tracked production bugs) rather than resting on reviewer visual impressions alone; the developers' general review qualifications and the specific numeric threshold used are not the actual flaw being described here."}
];

const PASS=72,SEC=900,app=document.getElementById('app');
let ans=Array(Q.length).fill(-1),cur=0,left=SEC,tm=null,done=false,rev=false;
const L="ABCD";
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function start(){app.innerHTML=`<div class="card"><div class="dm">Practice Exam · Block 5 of 5</div><h1 style="margin:.2em 0">CCAO-F Practice Exam</h1><p>Questions 61–75 (final block): 15 new scenario-based questions covering all seven blueprint domains, built from the Agent Factory study guide (4Ds, output evaluation, workflow design, skills &amp; connectors, governance).</p><p><b>Time:</b> 15 minutes · <b>Pass:</b> ${PASS}% (${Math.ceil(Q.length*PASS/100)} of ${Q.length}) · Feedback is shown only after you submit.</p><button class="b" onclick="go()">Start exam</button></div>`}
function go(){tm=setInterval(()=>{left--;const e=document.getElementById('tm');if(e){e.textContent=fmt(left);e.classList.toggle('lo',left<300)}if(left<=0)finish()},1000);draw()}
function draw(){const q=Q[cur];app.innerHTML=`<div class="bar"><span>Question ${cur+1}/${Q.length}</span><span class="t" id="tm">${fmt(left)}</span><button class="b" style="padding:7px 12px;font-size:14px" onclick="sub()">■ Stop &amp; get result</button></div><div class="pg"><i style="width:${(ans.filter(x=>x>=0).length/Q.length)*100}%"></i></div><div class="card"><div class="dm">${q.d}</div><p><b>Scenario:</b> ${q.q}</p>${q.o.map((t,i)=>`<button class="o ${ans[cur]===i?'s':''}" onclick="pick(${i})"><b>${L[i]})</b> ${t}</button>`).join('')}</div><div class="r"><button class="b g" onclick="mv(-1)" ${cur?'':'disabled'}>← Back</button>${cur<Q.length-1?`<button class="b" onclick="mv(1)">Next →</button>`:`<button class="b" onclick="sub()">Submit exam</button>`}</div><div class="nav">${Q.map((_,i)=>`<span class="${ans[i]>=0?'d':''} ${i===cur?'c2':''}" onclick="cur=${i};draw()">${i+1}</span>`).join('')}</div>`}
function pick(i){ans[cur]=i;draw()}function mv(n){cur+=n;draw()}
function sub(){const u=ans.filter(x=>x<0).length;if(!u||confirm(u+' question(s) unanswered. Submit anyway?'))finish()}
function finish(){if(done)return;done=true;clearInterval(tm);result()}
function result(){const ok=Q.map((q,i)=>ans[i]===q.a),n=ok.filter(Boolean).length,p=Math.round(n/Q.length*1000)/10,pass=p>=PASS;
const dom={};Q.forEach((q,i)=>{dom[q.d]=dom[q.d]||[0,0];dom[q.d][1]++;if(ok[i])dom[q.d][0]++});
app.innerHTML=`<div class="card">${pass?'<div class="star">⭐</div>':''}<h1 class="c" style="margin:.1em 0">${pass?'You passed! 🎉':'Not quite yet'}</h1><p class="big" style="color:${pass?'var(--ok)':'var(--no)'}">${p}%</p><p class="c">${n} of ${Q.length} correct · pass mark ${PASS}% · time used ${fmt(SEC-left)}</p><p class="c">${pass?'Outstanding work, shining star! You have completed all five blocks of the CCAO-F practice exam!.':'Review the explanations below, then retry. Weak domains are the likeliest to sink you on a different question draw.'}</p></div><div class="card"><b>Score by domain</b>${Object.entries(dom).map(([k,v])=>`<div class="dr"><span>${k}</span><span>${v[0]}/${v[1]}</span></div>`).join('')}</div><div class="r"><button class="b" onclick="rv()">Review answers</button><button class="b g" onclick="location.reload()">Retake</button></div>`;
if(pass)for(let i=0;i<28;i++)setTimeout(()=>{const s=document.createElement('div');s.className='sp';s.textContent=['⭐','✨','🌟'][i%3];s.style.left=Math.random()*95+'vw';s.style.top=(40+Math.random()*50)+'vh';document.body.appendChild(s);setTimeout(()=>s.remove(),2500)},i*90)}
function rv(){app.innerHTML=`<div class="r"><button class="b g" onclick="result()">← Results</button></div>`+Q.map((q,i)=>`<div class="card"><div class="dm">Q${i+1} · ${q.d}</div><p>${q.q}</p>${q.o.map((t,j)=>`<div class="o ${j===q.a?'ok':(j===ans[i]?'no':'')}"><b>${L[j]})</b> ${t}${j===ans[i]?' <i>(your answer)</i>':''}</div>`).join('')}<div class="ex"><b>Correct: ${L[q.a]}.</b> ${q.e}</div></div>`).join('')}
start();
</script></body></html>
